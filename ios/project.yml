name: LaReader
options:
  bundleIdPrefix: app.la
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.1
settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 2.0.0
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LaReader:
    type: application
    platform: iOS
    sources: [LaReader]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.la.reader
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: LaReader/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    postBuildScripts:
      - name: Copy fixtures only for UI testing
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ] && [ "$ENABLE_TEST_FIXTURES" = "YES" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TestBooks"
            cp "$SRCROOT/../test-fixtures/"* "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TestBooks/"
          fi
  LaReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LaReaderTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LaReader
  LaReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LaReaderUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LaReader
schemes:
  LaReader:
    build:
      targets:
        LaReader: all
    test:
      targets: [LaReaderTests, LaReaderUITests]
      gatherCoverageData: true
