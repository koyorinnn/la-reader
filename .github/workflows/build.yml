name: Native iOS and Android
on:
  push:
    branches: [main, native-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: SwiftUI · iPad tests and IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 scripts/make-fixtures.py
      - name: Restore Swift package build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build-ios
          key: ios26-readium3111-${{ github.sha }}
          restore-keys: ios26-readium3111-
      - name: Select iPad simulator
        run: python3 scripts/select-simulator.py
      - name: Test native iPad library and readers
        run: |
          set -o pipefail
          xcodebuild test -project ios/LaReader.xcodeproj -scheme LaReader \
            -destination "platform=iOS Simulator,id=$(cat simulator-id.txt)" \
            -derivedDataPath build-ios -resultBundlePath artifacts/iPad-tests.xcresult \
            ENABLE_TEST_FIXTURES=YES CODE_SIGNING_ALLOWED=NO \
            | tee ios-test.log
      - name: Export test screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -d artifacts/iPad-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/iPad-tests.xcresult --output-path artifacts/screenshots || true
          fi
      - name: Test iPhone layout and touch input
        run: |
          set -o pipefail
          python3 scripts/select-simulator.py iPhone
          xcodebuild test -project ios/LaReader.xcodeproj -scheme LaReader \
            -only-testing:LaReaderUITests \
            -destination "platform=iOS Simulator,id=$(cat simulator-id.txt)" \
            -derivedDataPath build-ios -resultBundlePath artifacts/iPhone-tests.xcresult \
            ENABLE_TEST_FIXTURES=YES CODE_SIGNING_ALLOWED=NO | tee iphone-test.log
      - name: Export iPhone screenshots
        if: always()
        run: |
          if [ -d artifacts/iPhone-tests.xcresult ]; then
            mkdir -p artifacts/iphone-screenshots
            xcrun xcresulttool export attachments --path artifacts/iPhone-tests.xcresult --output-path artifacts/iphone-screenshots || true
          fi
      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild archive -project ios/LaReader.xcodeproj -scheme LaReader \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath artifacts/LaReader.xcarchive -derivedDataPath build-ios-device \
            CODE_SIGNING_ALLOWED=NO ENABLE_TEST_FIXTURES=NO | tee ios-archive.log
      - name: Package IPA
        run: |
          APP=artifacts/LaReader.xcarchive/Products/Applications/LaReader.app
          test -d "$APP"
          test ! -d "$APP/TestBooks"
          mkdir -p artifacts/ipa/Payload
          ditto "$APP" artifacts/ipa/Payload/LaReader.app
          ditto -c -k --keepParent artifacts/ipa/Payload artifacts/LaReader-2.0.0-native-unsigned.ipa
          unzip -t artifacts/LaReader-2.0.0-native-unsigned.ipa
          ditto -c -k --keepParent build-ios/Build/Products/Debug-iphonesimulator/LaReader.app artifacts/LaReader-native-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: la-reader-native-ios-unsigned
          path: artifacts/LaReader-2.0.0-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: la-reader-native-ipad-tests
          path: |
            artifacts/screenshots/
            artifacts/iPad-tests.xcresult/
            artifacts/iPhone-tests.xcresult/
            artifacts/iphone-screenshots/
            artifacts/LaReader-native-simulator.zip
            ios/LaReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ios-test.log
            ios-archive.log
            iphone-test.log
          retention-days: 7
      - name: Cache compiled Swift dependencies
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: build-ios
          key: ios26-readium3111-${{ github.sha }}
  android:
    name: Kotlin · tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Restore Gradle dependencies
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle97-readium340-${{ github.sha }}
          restore-keys: gradle97-readium340-
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Test and build native Android
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Prepare private Android test books
        run: |
          python3 scripts/make-fixtures.py
          mkdir -p android/app/src/androidTest/assets
          cp test-fixtures/* android/app/src/androidTest/assets/
          sudo chmod 666 /dev/kvm
      - name: Test native readers on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            cd android
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Collect Android screenshots
        if: always()
        run: |
          mkdir -p artifacts/android-screenshots
          adb pull /sdcard/Android/data/app.la.reader/files/screenshots artifacts/android-screenshots || true
      - uses: actions/upload-artifact@v7
        with:
          name: la-reader-native-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: la-reader-native-android-tests
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            artifacts/android-screenshots/
          retention-days: 7
      - name: Cache Gradle dependencies
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle97-readium340-${{ github.sha }}
